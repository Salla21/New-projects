    contentType: video
    enabled: false  # Enable when channel ID is verified

  - id: eye-africa-youtube
    name: Eye Africa TV
    connectorType: youtube
    channelId: PLACEHOLDER_EYE_AFRICA_CHANNEL_ID
    isOfficialSource: false
    contentType: video
    enabled: false

  - id: kerr-fatou-youtube
    name: Kerr Fatou Video
    connectorType: youtube
    channelId: PLACEHOLDER_KERR_FATOU_CHANNEL_ID
    isOfficialSource: false
    contentType: video
    enabled: false

  # Podcasts (RSS URLs need verification)
  - id: bitilo-podcast
    name: Bitilo Podcast
    connectorType: podcast
    url: PLACEHOLDER_BITILO_RSS
    isOfficialSource: false
    enabled: false

  # Official sources (manual)
  - id: gambia-daily-gov
    name: Gambia Daily (Government)
    connectorType: manual
    manualFile: config/manual/gambia-daily.json
    isOfficialSource: true
    enabled: false

